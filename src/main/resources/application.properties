spring.application.name=queueforge
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

queueforge.jwt.secret=change-me-local-dev-secret-change-me-local-dev-secret-change-me-local-dev-secret
queueforge.jwt.issuer=queueforge
queueforge.jwt.access-token-ttl-seconds=3600